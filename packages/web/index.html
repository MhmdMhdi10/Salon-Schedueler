<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FBF7F2" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <!-- Apply the persisted theme before first paint so there is no flash of
       the wrong theme (matches src/components/theme/ThemeProvider.tsx:
       localStorage 'salon-theme' → light). The OS `prefers-color-scheme` is
       intentionally NOT consulted: a dark-OS visitor still lands on the warm
       porcelain palette and only flips to dark via the explicit toggle. Kept
       inline and dependency-free so it runs before the module bundle loads. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('salon-theme');
        var theme = stored === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#1A1117' : '#FBF7F2');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <!-- Preload the above-the-fold Vazirmatn weight (Persian/Arabic subset) to
       avoid FOIT on the OTP/booking screens; matches the @font-face src in
       src/styles/tokens.css. crossorigin is required for font preloads. -->
  <link
    rel="preload"
    as="font"
    type="font/woff2"
    href="/fonts/vazirmatn-arabic-wght-normal.woff2"
    crossorigin
  />
  <title>سامانه رزرو سالن</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
