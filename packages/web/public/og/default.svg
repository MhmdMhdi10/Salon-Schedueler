<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" dir="rtl">
  <defs>
    <!-- Magenta gradient accent strip -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D81B60" />
      <stop offset="100%" stop-color="#FF6B9D" />
    </linearGradient>
    <!-- Subtle radial glow behind text -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D81B60" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0A0A0A" />

  <!-- Subtle radial glow in center -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)" />

  <!-- Magenta accent strip at top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#magentaGrad)" />

  <!-- Decorative petal arc motif (top-left, subtle) -->
  <g opacity="0.08" transform="translate(80, 80)">
    <path d="M0,60 Q30,0 60,60 Q30,120 0,60" fill="#D81B60" />
    <path d="M20,60 Q50,10 80,60 Q50,110 20,60" fill="#FF6B9D" />
  </g>

  <!-- Decorative petal arc motif (bottom-right, subtle) -->
  <g opacity="0.08" transform="translate(1040, 470)">
    <path d="M0,60 Q30,0 60,60 Q30,120 0,60" fill="#D81B60" />
    <path d="M20,60 Q50,10 80,60 Q50,110 20,60" fill="#FF6B9D" />
  </g>

  <!-- Platform name in Persian (RTL, centered) -->
  <text
    x="600"
    y="280"
    text-anchor="middle"
    font-family="Vazirmatn, Tahoma, sans-serif"
    font-size="72"
    font-weight="800"
    fill="#FAFAFA"
    direction="rtl"
    unicode-bidi="bidi-override"
  >رزرو سالن</text>

  <!-- Tagline in Persian -->
  <text
    x="600"
    y="350"
    text-anchor="middle"
    font-family="Vazirmatn, Tahoma, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#A8A8A8"
    direction="rtl"
    unicode-bidi="bidi-override"
  >رزرو آنلاین نوبت سالن‌های زیبایی</text>

  <!-- Magenta brand line below tagline -->
  <rect x="480" y="385" width="240" height="4" rx="2" fill="#D81B60" />

  <!-- Bottom accent strip -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#magentaGrad)" />

  <!-- Domain/URL hint -->
  <text
    x="600"
    y="560"
    text-anchor="middle"
    font-family="Vazirmatn, Tahoma, sans-serif"
    font-size="20"
    font-weight="400"
    fill="#5B6573"
  >example.ir</text>
</svg>
