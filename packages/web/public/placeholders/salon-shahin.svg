<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F1E33"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <g opacity="0.1" transform="translate(490, 50)">
    <rect x="0" y="0" width="4" height="50" rx="2" fill="white"/>
    <rect x="12" y="10" width="4" height="40" rx="2" fill="white"/>
    <rect x="24" y="5" width="4" height="45" rx="2" fill="white"/>
  </g>
  <text x="320" y="160" text-anchor="middle" dominant-baseline="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="36" font-weight="700" fill="white" direction="rtl">آرایشگاه شاهین</text>
  <text x="320" y="210" text-anchor="middle" dominant-baseline="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" fill="white" opacity="0.7" direction="rtl">یوسف‌آباد، تهران</text>
  <rect x="260" y="235" width="120" height="3" rx="1.5" fill="white" opacity="0.3"/>
</svg>
