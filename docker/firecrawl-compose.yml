name: salon-firecrawl

# Self-hosted Firecrawl — isolated from the salon dev stack so it can be started
# only when scraping is needed. Brings up Firecrawl's API (scrape / crawl / map /
# extract) using prebuilt GHCR images (no clone of the Firecrawl repo required).
#
#   docker compose -f docker/firecrawl-compose.yml --env-file .env.firecrawl up
#   # API:        http://localhost:${FIRECRAWL_HOST_PORT:-3002}
#   # Queue admin: http://localhost:${FIRECRAWL_HOST_PORT:-3002}/admin/CHANGEME/queues
#
# The salon backend reaches Firecrawl over the host at http://host.docker.internal:3002
# (FIRECRAWL_API_URL) — see packages/backend/.env.example. Self-hosted Firecrawl
# does not require an API key (set FIRECRAWL_API_KEY only to gate access).
#
# Resource note: playwright-service + api are heavy (~6G RAM together). Start it
# on demand; `docker compose -f docker/firecrawl-compose.yml down` to reclaim.

services:
  redis:
    image: redis:alpine
    networks: [firecrawl]
    command: redis-server --bind 0.0.0.0
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    networks: [firecrawl]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    networks: [firecrawl]
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-4}
    cpus: 2.0
    mem_limit: 4g
    restart: unless-stopped

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    networks: [firecrawl]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firecrawl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firecrawl_password}
      POSTGRES_DB: ${POSTGRES_DB:-firecrawl}
    volumes:
      - firecrawl-pg:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    networks: [firecrawl]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      POSTGRES_USER: ${POSTGRES_USER:-firecrawl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firecrawl_password}
      POSTGRES_DB: ${POSTGRES_DB:-firecrawl}
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: 5432
      USE_DB_AUTHENTICATION: 'false'
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-4}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-4}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-2}
      BULL_AUTH_KEY: ${BULL_AUTH_KEY:-CHANGEME}
      # AI/extract features are optional for scraping; leave unset to disable.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_started
    ports:
      - '${FIRECRAWL_HOST_PORT:-3002}:3002'
    cpus: 2.0
    mem_limit: 4g
    command: node dist/src/harness.js --start-docker
    restart: unless-stopped

networks:
  firecrawl:
    driver: bridge

volumes:
  firecrawl-pg:
