server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Keep the shell fresh so deploys pick up the new hashed asset names. Vite
  # assets themselves are content-hashed and safe to cache for a long time.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Same-origin API proxy — browser never needs CORS or a second public origin.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Same-origin notification WebSocket proxy.
  location /ws/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location = /healthz {
    proxy_pass http://backend:3000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # SPA fallback keeps deep links/load-after-refresh functional.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
