name: Full QA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    name: Unit, backend E2E, and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QA_ARTIFACT_DIR: artifacts/qa
      E2E_BASE_URL: http://localhost:5173
      E2E_WEB_BASE_URL: http://localhost:5173
      E2E_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Docker development stack
        run: docker compose up -d --build --wait

      - name: Wait for API and web routes
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/business/register >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color backend frontend
          exit 1

      - name: Run complete QA suite
        run: npm run qa

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            artifacts/qa/**
            backend/coverage/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Docker stack
        if: always()
        run: docker compose down
