<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2530" />
    <meta name="description" content="Ara investor pitch deck — Persian and English interactive presentation." />
    <title>آرا | Investor Pitch Deck</title>
    <style>
      @font-face {
        font-family: AraSans;
        src: url("../frontend/public/fonts/vazirmatn-arabic-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
      }
      @font-face {
        font-family: AraSans;
        src: url("../frontend/public/fonts/vazirmatn-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-024F, U+1E00-1EFF;
      }

      :root {
        --bg: #f4f7f3;
        --surface: #ffffff;
        --surface-2: #eef5f1;
        --ink: #0b2530;
        --muted: #65757d;
        --line: #d8e3de;
        --teal: #0b806d;
        --teal-2: #d9efe9;
        --blue: #2c5fe0;
        --blue-2: #e7edff;
        --coral: #de705e;
        --coral-2: #fae6e0;
        --gold: #c98b28;
        --gold-2: #f4ead5;
        --navy: #0b2530;
        --shadow: 0 24px 70px rgba(21, 46, 52, 0.1);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
      }

      * { box-sizing: border-box; }
      html { min-width: 320px; background: var(--bg); }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% -10%, rgba(11, 128, 109, 0.11), transparent 32rem),
          radial-gradient(circle at 8% 96%, rgba(44, 95, 224, 0.07), transparent 28rem),
          var(--bg);
        font-family: AraSans, Vazirmatn, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        font-variant-numeric: tabular-nums;
      }
      button, a { font: inherit; }
      button { border: 0; cursor: pointer; }
      a { color: inherit; }
      :focus-visible {
        outline: 3px solid rgba(44, 95, 224, 0.55);
        outline-offset: 4px;
      }
      .skip-link {
        position: fixed;
        z-index: 20;
        top: 12px;
        left: 12px;
        padding: 9px 13px;
        border-radius: 10px;
        color: white;
        background: var(--navy);
        transform: translateY(-150%);
      }
      .skip-link:focus { transform: translateY(0); }

      .app-shell {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 100vh;
      }
      .rail {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        align-self: start;
        height: 100vh;
        padding: 26px 20px 20px;
        color: #eef8f3;
        background: linear-gradient(160deg, #0a222d 0%, #123540 100%);
        overflow: hidden;
      }
      .rail::after {
        position: absolute;
        right: -84px;
        bottom: -94px;
        width: 230px;
        height: 230px;
        border: 1px solid rgba(158, 216, 202, 0.18);
        border-radius: 50%;
        box-shadow: 0 0 0 28px rgba(158, 216, 202, 0.04), 0 0 0 58px rgba(158, 216, 202, 0.03);
        content: "";
        pointer-events: none;
      }
      .brand-lockup {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 11px;
        align-items: center;
        margin-bottom: 28px;
      }
      .brand-lockup img { width: 55px; height: 55px; object-fit: contain; }
      .brand-lockup strong { display: block; font-size: 18px; letter-spacing: -0.02em; }
      .brand-lockup span { display: block; margin-top: 2px; color: #9fd8cb; font-size: 12px; }
      .rail-label {
        position: relative;
        z-index: 1;
        margin: 0 8px 12px;
        color: #8fb7b1;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .slide-nav {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 4px;
        overflow: auto;
        padding: 0 0 10px;
        scrollbar-width: thin;
        scrollbar-color: rgba(159, 216, 203, 0.35) transparent;
      }
      .nav-item {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        min-height: 36px;
        padding: 7px 8px;
        border-radius: 11px;
        color: #b7cbc7;
        background: transparent;
        text-align: start;
        transition: 160ms ease;
      }
      .nav-item:hover { color: white; background: rgba(255,255,255,0.07); }
      .nav-item.is-active {
        color: var(--ink);
        background: #e3f2ed;
        box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      }
      .nav-number { color: #76a59e; font-size: 11px; font-weight: 800; }
      .nav-item.is-active .nav-number { color: var(--teal); }
      .nav-title { overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .rail-footer {
        position: relative;
        z-index: 1;
        margin-top: auto;
        padding: 15px 8px 2px;
        border-top: 1px solid rgba(190, 230, 220, 0.16);
        color: #8fb7b1;
        font-size: 11px;
      }

      .workspace { min-width: 0; }
      .topbar {
        position: sticky;
        z-index: 5;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 78px;
        padding: 16px clamp(18px, 4vw, 58px);
        border-bottom: 1px solid rgba(216, 227, 222, 0.75);
        background: rgba(244, 247, 243, 0.84);
        backdrop-filter: blur(18px);
      }
      .topbar-intro { display: flex; gap: 12px; align-items: center; min-width: 0; }
      .topbar-intro .mini-logo { width: 35px; height: 35px; object-fit: contain; }
      .topbar-intro strong { display: block; font-size: 15px; }
      .topbar-intro span { display: block; color: var(--muted); font-size: 11px; }
      .topbar-actions { display: flex; gap: 8px; align-items: center; }
      .lang-toggle {
        display: inline-flex;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .lang-toggle button {
        min-width: 62px;
        padding: 6px 10px;
        border-radius: 9px;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        font-weight: 800;
      }
      .lang-toggle button.is-active { color: white; background: var(--teal); }
      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 37px;
        height: 37px;
        border: 1px solid var(--line);
        border-radius: 11px;
        color: var(--ink);
        background: var(--surface);
        transition: 160ms ease;
      }
      .icon-button:hover { color: white; background: var(--ink); transform: translateY(-1px); }
      .icon-button svg { width: 17px; height: 17px; }

      .deck-stage { padding: clamp(24px, 4vw, 50px) clamp(18px, 4vw, 58px) 38px; }
      .stage-meta {
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: space-between;
        max-width: 1380px;
        margin: 0 auto 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .stage-meta strong { color: var(--ink); }
      .progress-track { flex: 1; max-width: 340px; height: 5px; border-radius: 999px; background: #dde8e3; overflow: hidden; }
      .progress-value { width: 5.55%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--blue)); transition: width 220ms ease; }
      .slides { max-width: 1380px; margin: 0 auto; }
      .slide { display: none; scroll-margin-top: 104px; animation: slide-in 260ms ease both; }
      .slide.is-active { display: block; }
      @keyframes slide-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .slide-shell {
        position: relative;
        min-height: min(720px, calc(100vh - 166px));
        padding: clamp(24px, 4vw, 48px);
        border: 1px solid rgba(216, 227, 222, 0.92);
        border-radius: var(--radius-xl);
        background: rgba(255,255,255,0.75);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .slide-shell.dark { color: #edf8f3; border-color: rgba(159, 216, 203, 0.12); background: linear-gradient(145deg, #0b2530, #123744); }
      .slide-head { max-width: 920px; margin-bottom: 34px; }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--teal);
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .eyebrow::before { display: block; width: 26px; height: 3px; border-radius: 999px; background: currentColor; content: ""; }
      .dark .eyebrow { color: #9fd8cb; }
      h1, h2, h3, p { margin-top: 0; }
      .slide-head h1 { max-width: 960px; margin-bottom: 8px; font-size: clamp(30px, 4vw, 51px); line-height: 1.12; letter-spacing: -0.04em; }
      .slide-head p { max-width: 900px; margin-bottom: 0; color: var(--muted); font-size: clamp(14px, 1.6vw, 18px); }
      .dark .slide-head p { color: #b7cec8; }
      .slide-number { position: absolute; inset-inline-end: 42px; bottom: 26px; color: var(--muted); font-size: 11px; }
      .dark .slide-number { color: #91b5ae; }

      .cover-shell { min-height: min(720px, calc(100vh - 166px)); padding: 0; background: var(--surface); }
      .cover-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(350px, 0.83fr); min-height: min(720px, calc(100vh - 166px)); }
      html[dir="rtl"] .cover-grid { grid-template-columns: minmax(350px, 0.83fr) minmax(0, 1fr); }
      .cover-copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(30px, 6vw, 76px); }
      .cover-copy .eyebrow { color: var(--teal); }
      .cover-kicker { margin-bottom: 20px; color: var(--muted); font-size: 13px; font-weight: 700; }
      .cover-copy h1 { margin-bottom: 16px; font-size: clamp(50px, 7vw, 92px); letter-spacing: -0.06em; line-height: 0.95; }
      .cover-copy h2 { max-width: 640px; margin-bottom: 18px; color: var(--teal); font-size: clamp(22px, 3vw, 38px); line-height: 1.2; letter-spacing: -0.04em; }
      .cover-copy p { max-width: 590px; margin-bottom: 28px; color: var(--muted); font-size: clamp(15px, 1.6vw, 19px); }
      .cover-media { position: relative; min-height: 470px; overflow: hidden; background: #dfeee8; }
      .cover-media::after { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,37,48,0.02), rgba(11,37,48,0.2)); content: ""; }
      html[dir="rtl"] .cover-media::after { background: linear-gradient(270deg, rgba(11,37,48,0.02), rgba(11,37,48,0.2)); }
      .cover-media img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
      .cover-badge, .raise-badge {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        gap: 8px;
        padding: 13px 18px;
        border-radius: 14px;
        color: white;
        background: var(--navy);
        font-weight: 850;
        box-shadow: 0 14px 28px rgba(11,37,48,0.14);
      }
      .cover-badge::before { width: 7px; height: 7px; border-radius: 50%; background: #9fd8cb; content: ""; }
      .source-line { margin-top: 34px; color: var(--muted); font-size: 11px; }

      .lead-statement { max-width: 800px; margin-bottom: 32px; color: var(--teal); font-size: clamp(26px, 3.5vw, 44px); font-weight: 850; line-height: 1.16; letter-spacing: -0.05em; }
      .metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 26px; }
      .metric-card { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(255,255,255,0.85); }
      .metric-value { margin-bottom: 3px; color: var(--teal); font-size: 30px; font-weight: 900; line-height: 1; }
      .metric-card:nth-child(1) .metric-value { color: var(--blue); }
      .metric-card:nth-child(3) .metric-value { color: var(--coral); }
      .metric-label { color: var(--muted); font-size: 12px; }
      .dark .metric-card { border-color: rgba(159,216,203,0.16); background: rgba(255,255,255,0.06); }
      .dark .metric-label { color: #b7cec8; }

      .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
      .customer-grid, .why-now-grid, .team-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .customer-card, .why-now-card, .team-card { padding: 22px; border-radius: var(--radius-lg); background: var(--surface-2); }
      .customer-card:nth-child(1) { background: var(--teal-2); }
      .customer-card:nth-child(2) { background: var(--blue-2); }
      .customer-card:nth-child(3) { background: var(--coral-2); }
      .customer-card small, .why-now-card small, .team-card small { display: block; margin-bottom: 10px; color: var(--teal); font-size: 11px; font-weight: 900; }
      .customer-card:nth-child(2) small { color: var(--blue); }
      .customer-card:nth-child(3) small { color: var(--coral); }
      .customer-card strong, .why-now-card strong, .team-card h3 { display: block; margin-bottom: 8px; font-size: 19px; line-height: 1.2; }
      .customer-card p, .why-now-card p, .team-card p { margin: 0; color: var(--muted); font-size: 13px; }
      .customer-icp, .why-now-callout, .team-note { margin-top: 22px; padding: 16px 19px; border-radius: 14px; color: var(--teal); background: var(--teal-2); font-size: 13px; font-weight: 800; }
      .dark .why-now-card { color: #edf8f3; border: 1px solid rgba(159,216,203,0.12); background: rgba(255,255,255,0.07); }
      .dark .why-now-card small { color: #9fd8cb; }
      .dark .why-now-card p { color: #b7cec8; }
      .dark .why-now-callout { color: #edf8f3; background: rgba(159,216,203,0.13); }
      .team-card:nth-child(1) { background: var(--teal-2); }
      .team-card:nth-child(2) { background: var(--blue-2); }
      .team-card:nth-child(3) { background: var(--gold-2); }
      .team-card:nth-child(2) h3 { color: var(--blue); }
      .team-card:nth-child(3) h3 { color: var(--gold); }
      .team-card h3 { color: var(--teal); }
      .split-with-media { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 32px; align-items: center; }
      html[dir="rtl"] .split-with-media { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); }
      .info-card { padding: 24px; border: 1px solid transparent; border-radius: var(--radius-lg); }
      .info-card h3 { margin-bottom: 14px; font-size: 21px; }
      .info-card.owner { background: var(--coral-2); }
      .info-card.owner h3 { color: var(--coral); }
      .info-card.customer { background: var(--blue-2); }
      .info-card.customer h3 { color: var(--blue); }
      .bullet-list { display: grid; gap: 11px; padding: 0; margin: 0; list-style: none; }
      .bullet-list li { position: relative; padding-inline-start: 19px; color: var(--ink); font-size: 14px; }
      .bullet-list li::before { position: absolute; inset-inline-start: 0; top: 0.72em; width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; transform: translateY(-50%); }
      .dark .bullet-list li { color: #e6f1ed; }
      .bottom-callout { padding: 16px 20px; border-radius: 15px; color: var(--teal); background: var(--teal-2); font-weight: 850; }
      .callout-row { margin-top: 24px; }
      .feature-list { display: grid; gap: 15px; }
      .feature-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
      .feature-dot { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: white; background: var(--teal); font-size: 12px; font-weight: 800; }
      .feature-item:nth-child(2) .feature-dot { background: var(--blue); }
      .feature-item:nth-child(3) .feature-dot { background: var(--coral); }
      .feature-item strong { display: block; margin-bottom: 2px; font-size: 16px; }
      .feature-item span { display: block; color: var(--muted); font-size: 13px; }
      .image-panel { position: relative; min-height: 355px; padding: 24px; border-radius: var(--radius-lg); background: var(--surface-2); overflow: hidden; }
      .image-panel img { display: block; width: 100%; height: 320px; border-radius: 18px; object-fit: cover; box-shadow: 0 14px 34px rgba(11,37,48,0.15); }
      .device-pair { display: flex; gap: 18px; justify-content: center; align-items: end; min-height: 350px; padding: 12px 0 0; }
      .device { width: min(180px, 35%); padding: 8px; border: 6px solid #122b36; border-radius: 25px; background: #122b36; box-shadow: 0 22px 34px rgba(11,37,48,0.17); }
      .device:nth-child(2) { transform: translateY(22px); }
      .device img { display: block; width: 100%; height: 305px; border-radius: 15px; object-fit: cover; }

      .phase-card { position: relative; padding: 26px; border-radius: var(--radius-xl); min-height: 290px; }
      .phase-card.today { background: var(--teal-2); }
      .phase-card.next { background: var(--blue-2); }
      .phase-card .tag { margin-bottom: 18px; font-size: 12px; font-weight: 900; }
      .phase-card.today .tag { color: var(--teal); }
      .phase-card.next .tag { color: var(--blue); }
      .phase-card h3 { max-width: 370px; margin-bottom: 18px; font-size: clamp(22px, 2.5vw, 32px); line-height: 1.15; }
      .phase-card ul { margin: 0; padding-inline-start: 18px; color: var(--muted); font-size: 14px; }
      .phase-arrow { display: grid; place-items: center; align-self: center; color: white; }
      .phase-arrow span { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; color: white; background: var(--coral); font-size: 25px; }
      .phase-caption { margin-top: 18px; color: var(--coral); font-size: 13px; font-weight: 900; }
      .roadmap-track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 24px; }
      .roadmap-step { position: relative; padding: 13px 14px 12px; border-radius: 13px; background: var(--surface-2); }
      .roadmap-step::before { position: absolute; inset-inline-start: 0; top: 0; width: 100%; height: 3px; border-radius: 999px; background: var(--teal); content: ""; }
      .roadmap-step:nth-child(2)::before { background: var(--blue); }
      .roadmap-step:nth-child(3)::before { background: var(--gold); }
      .roadmap-step:nth-child(4)::before { background: var(--coral); }
      .roadmap-step small { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 850; }
      .roadmap-step strong { display: block; color: var(--ink); font-size: 14px; line-height: 1.25; }
      .journey-layout { display: grid; grid-template-columns: minmax(230px, 0.45fr) minmax(0, 1fr); gap: clamp(28px, 6vw, 74px); align-items: center; }
      html[dir="rtl"] .journey-layout { grid-template-columns: minmax(0, 1fr) minmax(230px, 0.45fr); }
      .phone-shot { justify-self: center; width: min(255px, 100%); padding: 8px; border: 7px solid #102833; border-radius: 30px; background: #102833; box-shadow: 0 24px 50px rgba(11,37,48,0.18); }
      .phone-shot img { display: block; width: 100%; height: 410px; border-radius: 19px; object-fit: cover; }
      .phone-note { margin-top: 10px; color: var(--muted); font-size: 11px; text-align: center; }
      .journey-steps { position: relative; display: grid; gap: 10px; }
      .journey-steps::before { position: absolute; inset-inline-start: 18px; top: 25px; bottom: 25px; width: 2px; background: repeating-linear-gradient(to bottom, #cfdfda 0 8px, transparent 8px 15px); content: ""; }
      .journey-step { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 15px; align-items: start; padding: 8px 0; }
      .step-number { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 50%; color: white; background: var(--teal); font-weight: 900; }
      .journey-step:nth-child(2) .step-number { background: var(--blue); }
      .journey-step:nth-child(3) .step-number { background: var(--coral); }
      .journey-step strong { display: block; margin: 4px 0 3px; font-size: 18px; }
      .journey-step span { color: var(--muted); font-size: 13px; }

      .table-wrap { width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
      table { width: 100%; border-collapse: collapse; min-width: 650px; }
      th, td { padding: 13px 15px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; font-size: 13px; }
      th { color: white; background: var(--navy); font-size: 12px; font-weight: 850; }
      tr:last-child td { border-bottom: 0; }
      tbody tr:nth-child(even) td { background: #fbfdfb; }
      .highlight-row td { background: var(--teal-2) !important; font-weight: 750; }
      .table-note { margin-top: 12px; color: var(--muted); font-size: 11px; }
      .table-link { color: var(--teal); font-weight: 850; text-decoration: none; }
      .table-link:hover { text-decoration: underline; }
      .local-competition-table td:first-child { white-space: nowrap; font-weight: 850; }
      .local-competition-table td:nth-child(2) { color: var(--teal); font-weight: 750; }
      .local-competition-table td:nth-child(4) { color: var(--ink); font-weight: 700; }
      .feature-matrix-wrap { width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
      .feature-matrix { min-width: 1080px; table-layout: fixed; }

        if (slide.kind === "revenue") return frame(slide, `<div class="revenue-layout"><div><h2 class="lead-statement" style="font-size:clamp(25px,3vw,39px);margin-bottom:24px;">${escapeHtml(value(T("سه لایهٔ درآمد", "Three revenue layers")))}</h2><div class="revenue-layers">${slide.layers.map((layer) => `<div class="revenue-layer"><span class="layer-line"></span><div><small>${escapeHtml(value(layer[0]))}</small><strong>${escapeHtml(value(layer[1]))}</strong><span>${escapeHtml(value(layer[2]))}</span></div></div>`).join("")}</div></div><div><div class="table-wrap">${renderTable(slide.headers, slide.prices, "pricing-table").replace('<div class="table-wrap">','').replace('</div>','')}</div><p class="pricing-note">${escapeHtml(value(slide.note))}</p></div></div>`);
        if (slide.kind === "gtm") return frame(slide, `<div class="gtm-layout"><div class="channel-list">${slide.channels.map((channel) => `<div class="channel"><span class="channel-line"></span><div><strong>${escapeHtml(value(channel[0]))}</strong><span>${escapeHtml(value(channel[1]))}</span></div></div>`).join("")}</div><div><div class="chart-card"><svg viewBox="0 0 620 340" role="img" aria-label="${escapeHtml(state.lang === "fa" ? "هدف سالن فعال: ۵۰، ۲۰۰، ۵۰۰ و ۱۰۰۰" : "Target active salons: 50, 200, 500 and 1000")}"><rect x="38" y="18" width="548" height="274" rx="12" fill="#fbfdfb" stroke="#d8e3de"/><g stroke="#e6efeb" stroke-width="1">${[0,1,2,3,4].map((i) => `<line x1="60" x2="568" y1="${270 - i*58}" y2="${270 - i*58}"/>`).join("")}</g><g fill="#65757d" font-size="14" text-anchor="end"><text x="53" y="276">0</text><text x="53" y="218">250</text><text x="53" y="160">500</text><text x="53" y="102">750</text><text x="53" y="44">1k</text></g><polyline points="${[50,200,500,1000].map((v,i)=>`${110+i*150},${270-(v/1000)*232}`).join(" ")}" fill="none" stroke="#0b806d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>${[50,200,500,1000].map((v,i)=>`<circle cx="${110+i*150}" cy="${270-(v/1000)*232}" r="6" fill="#0b806d"/><text x="${110+i*150}" y="${258-(v/1000)*232}" text-anchor="middle" font-size="14" font-weight="800" fill="#0b2530">${v >= 1000 ? "1k" : v}</text><text x="${110+i*150}" y="315" text-anchor="middle" font-size="13" fill="#65757d">${escapeHtml(value(slide.labels[i]))}</text>`).join("")}</svg></div><p class="chart-caption">${escapeHtml(value(slide.chartNote))}</p></div></div>`);
        if (slide.kind === "readiness") return `<article class="slide" data-key="${slide.key}"><div class="slide-shell dark"><div class="readiness-layout"><div class="readiness-copy">${header(slide)}${bullets(slide.bullets)}<div class="readiness-callout">${escapeHtml(value(slide.callout))}</div></div><div>${image(assets.profile, T("صفحهٔ پروفایل و رزرو سالن آرا", "Ara salon profile and booking page"), "readiness-image")}</div></div><div class="validation-strip">${slide.validationPlan.map((item) => `<div class="validation-card"><strong>${escapeHtml(value(item[0]))}</strong><span>${escapeHtml(value(item[1]))}</span></div>`).join("")}</div><span class="slide-number">${num(slides.indexOf(slide) + 1)} / ${num(slides.length)}</span></div></article>`;
        if (slide.kind === "unitEconomics") return frame(slide, `<div class="economics-grid">${slide.metrics.map((metric) => `<div class="economics-card"><small>${escapeHtml(value(metric[0]))}</small><strong>${escapeHtml(value(metric[1]))}</strong><span>${escapeHtml(value(metric[2]))}</span></div>`).join("")}</div><div class="economics-foot">${escapeHtml(value(slide.formula))}</div>`);
        if (slide.kind === "team") return frame(slide, `<div class="team-grid">${slide.members.map((member) => `<div class="team-card"><small>${escapeHtml(value(member[0]))}</small><h3>${escapeHtml(value(member[1]))}</h3><p>${escapeHtml(value(member[2]))}</p></div>`).join("")}</div><div class="team-note">${escapeHtml(value(slide.note))}</div>`);
        if (slide.kind === "financials") return frame(slide, `<div class="finance-layout"><div>${renderTable(slide.headers, slide.rows, "financial-table")}<p class="table-note">${escapeHtml(value(slide.note))}</p></div><div class="assumption-card"><h3>${escapeHtml(value(T("فرض‌های مدل", "Model assumptions")))}</h3>${bullets(slide.assumptions)}</div></div>`);
        if (slide.kind === "funding") return frame(slide, `<div class="funding-layout"><div class="donut-wrap"><div class="donut" role="img" aria-label="${escapeHtml(state.lang === "fa" ? "مصرف سرمایه: ۴۵، ۲۵، ۱۵، ۱۰ و ۵ درصد" : "Use of funds: 45, 25, 15, 10 and 5 percent")}"><span class="donut-label">$200k</span></div><div class="funding-list">${slide.funds.map((fund) => `<div class="funding-item"><span class="funding-swatch"></span><span>${escapeHtml(value(fund[0]))} · ${fund[1]}% · ${fund[2]}</span></div>`).join("")}</div></div><div><div class="table-wrap"><table class="pricing-table"><thead><tr><th>${escapeHtml(value(T("مصرف", "Use of funds")))}</th><th>${escapeHtml(value(T("سهم", "Share")))}</th><th>${escapeHtml(value(T("مبلغ", "Amount")))}</th></tr></thead><tbody>${slide.funds.map((fund) => `<tr><td>${escapeHtml(value(fund[0]))}</td><td>${fund[1]}%</td><td>${fund[2]}</td></tr>`).join("")}</tbody></table></div><div class="callout-row"><div class="bottom-callout">${escapeHtml(value(slide.objective))}</div></div></div></div>`);
        if (slide.kind === "terms") return frame(slide, `<div class="terms-layout"><div class="terms-card ask"><small>${escapeHtml(value(slide.askTitle))}</small><h2>${escapeHtml(value(slide.askAmount))}</h2>${bullets(slide.askBullets)}</div><div class="terms-card return"><small>${escapeHtml(value(slide.returnTitle))}</small><h2>${escapeHtml(value(slide.returnAmount))}</h2><p>${escapeHtml(value(slide.returnBody))}</p><div class="return-warning">${escapeHtml(value(slide.warning))}</div></div></div><p class="terms-footnote">${escapeHtml(value(slide.footnote))}</p>`);
        if (slide.kind === "risks") return frame(slide, `${renderTable(slide.headers, slide.rows, "risk-table")}<p class="risk-footer">${escapeHtml(value(slide.footer))}</p>`);
        if (slide.kind === "close") return frame(slide, `<p class="lead-statement">${escapeHtml(value(slide.title))}</p><p style="max-width:850px;color:var(--muted);font-size:18px;">${escapeHtml(value(slide.subtitle))}</p><div class="milestone-row">${slide.milestones.map((milestone, i) => `<div class="milestone" data-step="${num(i + 1)}">${escapeHtml(value(milestone))}</div>`).join("")}</div><div class="close-cta"><span class="raise-badge">${escapeHtml(value(slide.raise))}</span></div><p class="source-line">${escapeHtml(value(slide.next))}</p>`);
        return frame(slide, "");
      }

      function renderNav() {
        $("#slideNav").innerHTML = slides.map((slide, index) => `<button type="button" class="nav-item ${index === state.index ? "is-active" : ""}" data-go="${index}" aria-label="${escapeHtml(value(slide.nav))}"><span class="nav-number">${num(index + 1).padStart(2, state.lang === "fa" ? "۰" : "0")}</span><span class="nav-title">${escapeHtml(value(slide.nav))}</span></button>`).join("");
        $$("[data-go]").forEach((button) => button.addEventListener("click", () => showSlide(Number(button.dataset.go))));
      }

      function renderDeck() {
        document.documentElement.lang = state.lang === "fa" ? "fa" : "en";
        document.documentElement.dir = state.lang === "fa" ? "rtl" : "ltr";
        $("#slides").innerHTML = slides.map(renderSlide).join("");
        $$(".slide").forEach((slide, index) => slide.classList.toggle("is-active", index === state.index));
        renderNav();
        $("#totalSlideLabel").textContent = num(slides.length);
        $("#currentSlideLabel").textContent = num(state.index + 1).padStart(2, state.lang === "fa" ? "۰" : "0");
        $("#ofLabel").textContent = state.lang === "fa" ? "از" : "of";
        $("#modeLabel").textContent = state.lang === "fa" ? "نسخهٔ سرمایه‌گذاری" : "Investor edition";
        $("#railLabel").textContent = state.lang === "fa" ? "اسلایدها" : "Slides";
        $("#railSubtitle").textContent = state.lang === "fa" ? "نسخهٔ سرمایه‌گذاری" : "Investor pitch deck";
        $("#railFooter").textContent = state.lang === "fa" ? "محرمانه · شهریور ۱۴۰۵" : "Confidential · September 2026";
        $("#topbarTitle").textContent = state.lang === "fa" ? "نسخهٔ سرمایه‌گذاری آرا" : "Ara investor edition";
        $("#topbarSubtitle").textContent = state.lang === "fa" ? "SaaS سالن امروز؛ Discovery محلی فردا" : "Salon SaaS today; local discovery tomorrow";
        $("#keyboardHint").textContent = state.lang === "fa" ? "برای جابه‌جایی از کلیدهای ← و → استفاده کنید" : "Use ← and → to navigate";
        $("#prevLabel").textContent = state.lang === "fa" ? "قبلی" : "Previous";
        $("#nextLabel").textContent = state.lang === "fa" ? "بعدی" : "Next";
        $("#prevButton").setAttribute("aria-label", state.lang === "fa" ? "اسلاید قبلی" : "Previous slide");
        $("#nextButton").setAttribute("aria-label", state.lang === "fa" ? "اسلاید بعدی" : "Next slide");
        $$("[data-lang]").forEach((button) => button.classList.toggle("is-active", button.dataset.lang === state.lang));
        $("#progressValue").style.width = `${((state.index + 1) / slides.length) * 100}%`;
        document.title = state.lang === "fa" ? "آرا | Pitch Deck سرمایه‌گذاری" : "Ara | Investor Pitch Deck";
      }

      function showSlide(index) {
        state.index = Math.max(0, Math.min(slides.length - 1, index));
        renderDeck();
        const active = $(".slide.is-active");
        if (active) active.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      $$("[data-lang]").forEach((button) => button.addEventListener("click", () => { state.lang = button.dataset.lang; renderDeck(); }));
      $("#prevButton").addEventListener("click", () => showSlide(state.index - 1));
      $("#nextButton").addEventListener("click", () => showSlide(state.index + 1));
      $("#printButton").addEventListener("click", () => window.print());
      $("#fullscreenButton").addEventListener("click", async () => {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
        else await document.exitFullscreen?.();
      });
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") { event.preventDefault(); showSlide(state.index + 1); }
        if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); showSlide(state.index - 1); }
        if (event.key === "Home") { event.preventDefault(); showSlide(0); }
        if (event.key === "End") { event.preventDefault(); showSlide(slides.length - 1); }
      });
      let touchStartX = null;
      document.addEventListener("touchstart", (event) => { touchStartX = event.changedTouches[0].clientX; }, { passive: true });
      document.addEventListener("touchend", (event) => {
        if (touchStartX === null) return;
        const delta = event.changedTouches[0].clientX - touchStartX;
        if (Math.abs(delta) > 55) showSlide(state.index + (delta < 0 ? 1 : -1));
        touchStartX = null;
      }, { passive: true });
      renderDeck();
      window.__ARA_DECK_READY__ = true;
    </script>
  </body>
</html>
