name: salon-booking

# Development environment for the Salon Booking System.
#
#   docker compose up                 # postgres + backend API + web PWA
#   docker compose --profile tools up # also start Adminer (DB UI) on :8080
#
# Source is bind-mounted for live edits; node_modules live in named volumes so
# the host's (possibly different-platform) modules never shadow the container's.

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon_dev
    ports:
      # Host port is overridable so it doesn't collide with a Postgres already
      # running on the host. Override via POSTGRES_HOST_PORT (see .env). The
      # backend always reaches the DB over the compose network at postgres:5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Message broker for the reliable-SMS pipeline (durable queues, publisher
  # confirms, retry + dead-letter). Management UI on :15672 (salon/salon).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: salon
      RABBITMQ_DEFAULT_PASS: salon
    ports:
      - "${RABBITMQ_HOST_PORT:-5673}:5672"
      - "${RABBITMQ_MGMT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # Development SMS inbox. The dev SMS adapter mirrors every outbound message
  # here so OTPs and appointment notifications can be inspected in a browser.
  sms-inbox:
    image: node:20-alpine
    command: [ "node", "/app/sms-inbox.mjs" ]
    environment:
      PORT: "4000"
      SMS_INBOX_DATA_FILE: "/data/messages.json"
    ports:
      - "${SMS_INBOX_HOST_PORT:-8025}:4000"
    volumes:
      - ./docker/sms-inbox.mjs:/app/sms-inbox.mjs:ro
      - sms-inbox-data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/healthz" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: salon-booking-backend-dev
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: [ "bash", "docker/backend-entrypoint.sh" ]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      sms-inbox:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: "postgresql://salon:salon@postgres:5432/salon_dev?schema=public"
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      PAYMENT_CALLBACK_BASE_URL: "http://localhost:3000"
      # Reliable SMS: publish to RabbitMQ (the sms-worker service delivers it).
      RABBITMQ_URL: "amqp://salon:salon@rabbitmq:5672"
      DEV_SMS_INBOX_URL: "http://sms-inbox:4000"
      NOTIFICATION_CRON_EXTERNAL: "true"
      # Development only: return the generated OTP so the web form can fill it
      # automatically. Production keeps this disabled and uses real SMS.
      DEV_OTP_AUTO_FILL: "true"
      # Cucumber creates one isolated salon per scenario. This only affects the
      # development container; production keeps the registration limit at 15.
      E2E_REGISTRATION_IP_LIMIT: "500"
      E2E_OTP_REQUEST_IP_LIMIT: "1000"
      E2E_OTP_REQUEST_PHONE_LIMIT: "500"
      E2E_OTP_VERIFY_IP_LIMIT: "1000"
      E2E_OTP_VERIFY_PHONE_LIMIT: "500"
      E2E_BOOKING_IP_LIMIT: "200"
      E2E_BOOKING_CUSTOMER_LIMIT: "100"
      E2E_APPOINTMENT_MUTATION_LIMIT: "200"
      E2E_AUTH_API_LIMIT: "1000"
      # Dev convenience: widen the OTP validity window to 10 minutes so manual
      # testing (read code from logs → type it) isn't rushed by the 2-minute
      # production default. Do NOT carry this into production.
      OTP_WINDOW_SECONDS: "600"
      # Optional: Melli Payamak shared templates receive positional args.
      # Keep token in .env only; dev normally leaves this unset.
      MELIPAYAMAK_URL: "${MELIPAYAMAK_URL-}"
      MELIPAYAMAK_BODY_ID: "${MELIPAYAMAK_BODY_ID:-523232}"
      # Legacy generated-code endpoint fallback.
      MELIPAYAMAK_OTP_URL: "${MELIPAYAMAK_OTP_URL-}"
      # Consumed by pg_isready + psql in the dev entrypoint.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: salon
      PGPASSWORD: salon
      PGDATABASE: salon_dev
      # SMS/push provider keys are intentionally unset -> dev/log adapters are used.
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - backend-root-node-modules:/app/node_modules
      - backend-backend-node-modules:/app/backend/node_modules
      - backend-shared-node-modules:/app/packages/shared/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # SMS delivery worker: consumes the durable `sms.send` queue and performs the
  # actual provider send (dev/log here) with manual ack, backoff retry, and
  # dead-lettering. Shares the backend image + node_modules volumes and runs the
  # compiled worker the backend's tsc-watch builds into dist/.
  sms-worker:
    image: salon-booking-backend-dev
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: [ "bash", "docker/sms-worker-entrypoint.sh" ]
    # Allocate a TTY so the worker's stdout is line-flushed and streamed to
    # `docker logs` in real time. This is a low-traffic, mostly-idle process, so
    # without a TTY Node buffers its startup/delivery lines in the stdout pipe
    # (they only flush on process exit). The result is a container that LOOKS
    # stuck on the initial "waiting..." line even though it has connected to the
    # broker and is actively consuming sms.send.
    tty: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://salon:salon@postgres:5432/salon_dev?schema=public"
      RABBITMQ_URL: "amqp://salon:salon@rabbitmq:5672"
      DEV_SMS_INBOX_URL: "http://sms-inbox:4000"
      # SMS provider keys intentionally unset -> dev/log delivery (logs here).
    volumes:
      - ./:/app
      - backend-root-node-modules:/app/node_modules
      - backend-backend-node-modules:/app/backend/node_modules
      - backend-shared-node-modules:/app/packages/shared/node_modules
    restart: unless-stopped

  # Dedicated scheduler for appointment reminders, expired holds, and
  # cancellation notifications. API keeps no duplicate scheduler in compose.
  notification-cron:
    image: salon-booking-backend-dev
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: [ "bash", "docker/notification-cron-entrypoint.sh" ]
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://salon:salon@postgres:5432/salon_dev?schema=public"
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      PAYMENT_CALLBACK_BASE_URL: "http://localhost:3000"
      RABBITMQ_URL: "amqp://salon:salon@rabbitmq:5672"
      DEV_SMS_INBOX_URL: "http://sms-inbox:4000"
      REMINDER_INTERVAL_MS: "60000"
      REMINDER_LEAD_TIME_MINUTES: "60"
    volumes:
      - ./:/app
      - backend-root-node-modules:/app/node_modules
      - backend-backend-node-modules:/app/backend/node_modules
      - backend-shared-node-modules:/app/packages/shared/node_modules
    restart: unless-stopped

  frontend:
    image: salon-booking-web-dev
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: [ "bash", "docker/web-entrypoint.sh" ]
    # Allocate a TTY so Vite's incremental output (HMR update lines, build
    # errors) is line-flushed and streamed to `docker logs` in real time.
    # Without it, Node block-buffers stdout to the log pipe, so live-reload
    # activity is invisible until enough output accumulates (same reason the
    # sms-worker sets this). Vite's screen-clear is disabled in vite.config.ts
    # so the log scrollback stays readable.
    tty: true
    depends_on:
      - backend
    environment:
      # The browser calls same-origin /api; the Vite dev server proxies it to the
      # backend over the compose network (see frontend/vite.config.ts).
      VITE_PROXY_TARGET: "http://backend:3000"
      # Live edits: the source is bind-mounted, but native fs events aren't
      # reliably delivered into the container, so Vite would never see host edits
      # and HMR would go silent. Poll for changes instead (mirrors the mobile
      # service). VITE_DEV_POLLING flips Vite's own watcher to polling;
      # CHOKIDAR_USEPOLLING is the de-facto global fallback honoured by chokidar.
      VITE_DEV_POLLING: "1"
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend-root-node-modules:/app/node_modules
      - frontend-frontend-node-modules:/app/frontend/node_modules
      - frontend-shared-node-modules:/app/packages/shared/node_modules
    restart: unless-stopped

  # Expo / React Native dev server (Metro). Start it with the `mobile` profile:
  #   HOST_LAN_IP=192.168.1.199 docker compose --profile mobile up
  #
  # IMPORTANT: a physical phone running Expo Go connects back to the dev machine
  # over the LAN, so Metro must advertise the HOST's IP (not the container IP).
  # Set HOST_LAN_IP to your machine's Wi-Fi IP (see .env). The app's API base URL
  # is derived from the same IP so the phone reaches the backend too.
  mobile:
    image: salon-booking-mobile-dev
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    profiles: [ "mobile" ]
    command: [ "bash", "docker/mobile-entrypoint.sh" ]
    depends_on:
      - backend
    environment:
      # Metro advertises this host so the QR / exp:// URL is reachable from the
      # phone. Defaults to localhost (only works for an emulator on the host).
      REACT_NATIVE_PACKAGER_HOSTNAME: "${HOST_LAN_IP:-localhost}"
      # The app (Expo Go on the phone) calls the backend at the host IP:3000.
      EXPO_PUBLIC_API_BASE_URL: "http://${HOST_LAN_IP:-localhost}:3000"
      # Expo in a container: poll for file changes (bind-mount fs events are
      # unreliable across the host boundary) and skip interactive prompts.
      CHOKIDAR_USEPOLLING: "1"
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "8081:8081"      # Metro bundler
      - "19000:19000"    # Expo dev server
      - "19001:19001"    # Expo dev server (legacy/manifest)
    volumes:
      - ./:/app
      - mobile-root-node-modules:/app/node_modules
      - mobile-mobile-node-modules:/app/packages/mobile/node_modules
      - mobile-shared-node-modules:/app/packages/shared/node_modules
    restart: unless-stopped

  # Optional lightweight DB UI: `docker compose --profile tools up`.
  adminer:
    image: adminer:4
    profiles: [ "tools" ]
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  sms-inbox-data:
  backend-root-node-modules:
  backend-backend-node-modules:
  backend-shared-node-modules:
  frontend-root-node-modules:
  frontend-frontend-node-modules:
  frontend-shared-node-modules:
  mobile-root-node-modules:
  mobile-mobile-node-modules:
  mobile-shared-node-modules:
